[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "org-cube-parse"
version = "0.1.0"
description = "Parse org-mode files into structured data for the org-cube indexing system"
readme = {file = "README.org", content-type = "text/plain"}
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "gdvek" },
]
keywords = ["org-mode", "orgparse", "parser", "emacs", "org-cube"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "orgparse>=0.4,<0.5",
]

[project.urls]
Homepage = "https://github.com/gdvek/org-cube-parse"
Repository = "https://github.com/gdvek/org-cube-parse"
Issues = "https://github.com/gdvek/org-cube-parse/issues"
Changelog = "https://github.com/gdvek/org-cube-parse/blob/main/CHANGELOG.org"

[tool.hatch.build.targets.wheel]
packages = ["org_cube_parse"]

[tool.hatch.build.targets.sdist]
include = ["org_cube_parse", "tests", "README.org", "CHANGELOG.org", "LICENSE"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
